{% import "partials/nav-item.html" as item with context %}
<nav id="whizam-project-navigation" class="md-nav md-nav--primary" aria-label="{{ lang.t('nav') }}" data-md-level="0">
  <div class="whizam-tool-heading"><a href="{{ base_url }}/">{{ config.site_name | e }}</a><button type="button" data-whizam-drawer class="whizam-close" tabindex="0" role="button" aria-label="{{ 'Close' if config.theme.language == 'en' else 'Fermer' }}">×</button></div>
  {% if "search" in config.plugins %}<div class="md-search" data-md-component="search" role="dialog" aria-label="{{ lang.t('search') }}">
    <button type="button" class="md-search__button" aria-label="{{ lang.t('search') }}">
      {{ lang.t('search') }}
      <code class="whizam-search-shortcut" aria-hidden="true"><span class="whizam-shortcut-mac">⌘</span><span class="whizam-shortcut-other">Ctrl</span><span>K</span></code>
    </button>
  </div>{% endif %}

  <ul class="md-nav__list" data-md-scrollfix>{% for nav_item in nav.items %}{% set path = "__nav_" ~ loop.index %}{{ item.render(nav_item, path, 1) }}{% endfor %}</ul>
  <div class="whizam-language-footer">
  <label class="whizam-language-control">
    <span class="md-icon" aria-hidden="true">{% include ".icons/lucide/globe.svg" %}</span>
    <select aria-label="{{ 'Documentation language' if config.theme.language == 'en' else 'Langue de documentation' }}" data-whizam-language>
    {% for alt in config.extra.alternate %}<option value="{{ alt.lang }}" {% if alt.lang == config.theme.language %}selected{% endif %}>{{ alt.name }}</option>{% endfor %}
    </select>
  </label>
  </div>
</nav>
