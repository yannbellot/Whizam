# Modèle autonome inactif. Après autorisation de publication, copier dans
# .github/workflows/documentation.yml et choisir Pages → Source : GitHub Actions.
name: Documentation
on:
  push:
    branches: [main]
    paths:
      - '**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm run docs:translations:check
      - name: Build and export documentation
        env:
          DOCS_URL: ${{ steps.pages.outputs.base_url }}/
        run: npm run docs:export -- "$DOCS_URL"
      - run: npm run docs:check
      - name: Locate exported site
        id: site
        run: node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(".runtime.local/documentation/export.json"));fs.appendFileSync(process.env.GITHUB_OUTPUT,"path="+m.site+"\n")'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.site.outputs.path }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
