name: ${COMPOSE_PROJECT_NAME:?Run the local setup first}
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Database name required}
      POSTGRES_USER: ${POSTGRES_USER:?Database user required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Local database password required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    labels:
      org.agentic-design.project: ${COMPOSE_PROJECT_NAME}
  app:
    build:
      context: .
      dockerfile: config/docker/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      ADL_CONTAINER: '1'
      PORT: '3000'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:${APP_PORT:?Application port required}:3000'
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:3000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    labels:
      org.agentic-design.project: ${COMPOSE_PROJECT_NAME}
volumes:
  database:
    labels:
      org.agentic-design.project: ${COMPOSE_PROJECT_NAME}
