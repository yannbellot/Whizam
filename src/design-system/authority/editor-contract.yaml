schemaVersion: 1
propertyGroups:
  - id: typography
    label: Typographie
    properties:
      - fontFamily
      - fontSize
      - fontWeight
      - lineHeight
      - foreground
  - id: colors
    label: Couleurs
    properties:
      - background
      - iconColor
  - id: borders
    label: Bordures
    properties:
      - borderColor
      - borderWidth
      - borderRadius
  - id: spacing
    label: Espacements
    properties:
      - paddingBlock
      - paddingInline
      - gap
      - pageMargin
  - id: dimensions
    label: Dimensions
    properties:
      - maxWidth
  - id: focus
    label: Contour de focus
    properties:
      - ringColor
      - ringWidth
      - ringOffset
properties:
  background:
    cssProperty: background-color
    type: color
    role: surface
    label: Arrière-plan
  foreground:
    cssProperty: color
    type: color
    role: text
    label: Couleur
  borderColor:
    cssProperty: border-color
    type: color
    role: border
    label: Couleur
  iconColor:
    cssProperty: color
    type: color
    role: icon
    label: Icônes
  ringColor:
    cssProperty: outline-color
    type: color
    role: focus
    label: Couleur
  borderRadius:
    cssProperty: border-radius
    type: dimension
    role: radius
    units:
      - px
      - rem
    label: Bords arrondis
  borderWidth:
    cssProperty: border-width
    type: dimension
    role: border-width
    units:
      - px
      - rem
    label: Épaisseur
  paddingBlock:
    cssProperty: padding-block
    type: dimension
    role: spacing
    units:
      - px
      - rem
    label: Intérieur — axe de bloc
  paddingInline:
    cssProperty: padding-inline
    type: dimension
    role: spacing
    units:
      - px
      - rem
    label: Intérieur — axe en ligne
  gap:
    cssProperty: gap
    type: dimension
    role: spacing
    units:
      - px
      - rem
    label: Entre éléments
  fontSize:
    cssProperty: font-size
    type: dimension
    role: font-size
    units:
      - px
      - rem
    label: Taille
  fontWeight:
    cssProperty: font-weight
    type: font-weight
    role: font-weight
    label: Graisse
  lineHeight:
    cssProperty: line-height
    type: line-height
    role: line-height
    label: Interligne
  fontFamily:
    cssProperty: font-family
    type: font-family
    role: font-family
    label: Famille
  ringWidth:
    cssProperty: outline-width
    type: dimension
    role: border-width
    units:
      - px
      - rem
    label: Épaisseur
  ringOffset:
    cssProperty: outline-offset
    type: dimension
    role: spacing
    units:
      - px
      - rem
    label: Décalage
  maxWidth:
    cssProperty: max-width
    type: dimension
    role: content-width
    units:
      - px
      - rem
    label: Largeur maximale
  pageMargin:
    cssProperty: padding
    type: dimension
    role: spacing
    units:
      - px
      - rem
    label: Intérieur de la page
fontFamilies:
  - ADL Inter, sans-serif
  - ADL Roboto, sans-serif
  - ADL Montserrat, sans-serif
  - ADL Lora, serif
  - Inter, ui-sans-serif, system-ui, sans-serif
targets:
  - id: button
    component: Button
    sheet: src/design-system/components/Button/Button.design.yaml
    variants:
      - default
    states:
      - default
      - hover
      - focus-visible
      - disabled
      - loading
    cells:
      - part: root
        properties:
          - background
          - foreground
          - borderRadius
          - paddingBlock
          - paddingInline
          - fontSize
          - fontWeight
          - lineHeight
          - fontFamily
        states:
          - default
      - part: root
        properties:
          - background
        states:
          - hover
          - disabled
          - loading
      - part: root
        properties:
          - ringColor
          - ringWidth
          - ringOffset
        states:
          - focus-visible
  - id: field
