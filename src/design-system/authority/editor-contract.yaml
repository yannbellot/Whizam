          - foreground
          - fontSize
          - fontWeight
          - lineHeight
          - fontFamily
        states:
          - default
      - part: control
        properties:
          - background
          - foreground
          - borderColor
          - borderWidth
          - borderRadius
          - paddingBlock
          - paddingInline
          - fontSize
          - fontWeight
          - fontFamily
        states:
          - default
          - disabled
      - part: control
        properties:
          - ringColor
          - ringWidth
          - ringOffset
        states:
          - focus-visible
  - id: notice
    component: Notice
    sheet: src/design-system/components/Notice.design.yaml
    variants:
      - info
