          - disabled
      - part: control
        properties:
          - ringColor
          - ringWidth
          - ringOffset
        states:
          - focus-visible
      - part: control
        properties:
          - borderColor
        states:
          - error
      - part: hint
        properties:
          - foreground
          - fontSize
          - fontWeight
          - lineHeight
          - fontFamily
